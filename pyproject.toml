[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-infra"
version = "0.1.0"
description = "Инфраструктурный слой: миграции, event router, мониторинг"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.14",
    "alembic>=1.10",
    "asyncpg>=0.28",
    "psycopg2-binary>=2.9",
    "httpx>=0.24",
]

[project.scripts]
infra-init = "infrastructure.cli:init"
infra-monitor = "infrastructure.cli:monitor"
infra-reset = "infrastructure.cli:reset"
infra = "infrastructure.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["infrastructure*"]

[tool.setuptools.package-data]
infrastructure = [
    "templates/*",
    "templates/env_template.txt",
    "db_migrator/alembic.ini",
    "db_migrator/alembic/*",
    "db_migrator/alembic/versions/*",
    "tests/*.py",
    "tests/test_db/*.py",
    "tests/test_router/*.py",
]
